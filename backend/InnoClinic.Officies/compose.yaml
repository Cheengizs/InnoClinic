name: 'InnoClinic_offices'
services:
  
  
  mongodb:
    image: mongo:latest
    container_name: office_mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=offices123
    volumes:
      - mongodb_data:/data/db

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: office_azurite
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck
    volumes:
      - azurite_data:/data
  

volumes:
  mongodb_data:
  azurite_data:
