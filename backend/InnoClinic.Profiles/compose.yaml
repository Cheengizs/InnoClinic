services:
  innoclinic_profiles_mssql_db:
    image : mcr.microsoft.com/mssql/server:2022-latest
    container_name: innoclinic_profiles_mssql_db
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - MSSQL_COLLATION=Cyrillic_General_CI_AS
